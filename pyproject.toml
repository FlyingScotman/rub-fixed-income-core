[project]
name = "rub-fixed-income-core"
version = "0.17.0"
description = "Deterministic RUB fixed-income dates, cash-flow, financing, yield, discount-curve, and KRS projection math"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rub_fixed_income"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/rub_fixed_income",
    "/tests",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "/dist",
    # Needs tools/, which is not shipped; it tests a proprietary-stack probe.
    "/tests/test_qr_bond_reconciliation_probe.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that exercises a deprecated API must say so (pytest.warns or a module mark).
filterwarnings = ["error:rub_fixed_income:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
files = ["rub_fixed_income", "tests", "benchmarks"]
# The QR reconciliation probe test drives an untyped proprietary-stack script (BACKLOG #16).
exclude = ["tests/test_qr_bond_reconciliation_probe\\.py$"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
